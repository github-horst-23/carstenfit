<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101310" />
  <meta name="description" content="Dein persönlicher Trainingsplan, Verlauf und Fortschritt." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://accounts.google.com/gsi/client"></script>
  <title>CarstenFit – dein Training</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="CarstenFit Startseite"><span class="brand-mark">C</span><span>carstenfit<span class="brand-dot">.</span></span></a>
      <button class="icon-button" id="installBtn" hidden aria-label="App installieren" title="App installieren">↓</button>
      <button class="avatar" id="settingsBtn" aria-label="Google Drive verbinden" title="Google Drive verbinden">C</button>
    </header>

    <main id="app" class="page"></main>
    <nav class="tabbar" aria-label="Hauptnavigation">
      <a href="#home" data-route="home"><span class="nav-icon">⌂</span><span>Heute</span></a>
      <a href="#plan" data-route="plan"><span class="nav-icon">▤</span><span>Plan</span></a>
      <a href="#catalog" data-route="catalog"><span class="nav-icon">＋</span><span>Katalog</span></a>
      <a href="#music" data-route="music"><span class="nav-icon">♫</span><span>Musik</span></a>
      <a href="#history" data-route="history"><span class="nav-icon">◷</span><span>Verlauf</span></a>
      <a href="#stats" data-route="stats"><span class="nav-icon">↗</span><span>Auswertung</span></a>
    </nav>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
